<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#ffffff" />
  <title>Daily Judgment</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="ghost menu-btn" aria-label="학습기록 열기">☰</button>
    <div>
      <p class="eyebrow">FINANCIAL JUDGMENT TRAINING</p>
      <h1>오늘의 판단</h1>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div>
          <p class="eyebrow">STUDY HISTORY</p>
          <h2>학습기록</h2>
        </div>
        <button id="closeSidebarBtn" class="ghost close-btn" aria-label="학습기록 닫기">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div class="sidebar-actions">
        <button id="exportBtn" class="ghost">기록 백업</button>
        <label class="ghost file-label">기록 복원<input id="importInput" type="file" accept="application/json" /></label>
      </div>
    </aside>

    <main class="container">
      <section id="todayView"></section>
    </main>
  </div>

  <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>
  <script src="./app.js" defer></script>
</body>
</html>
